name: Check Submodule Updates

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check for new release tags
        id: check
        run: |
          cd smartmontools
          git fetch --tags origin

          CURRENT_TAG=$(git describe --tags --exact-match 2>/dev/null || git rev-parse HEAD)
          echo "Current submodule ref: ${CURRENT_TAG}"

          LATEST_TAG=$(git tag -l 'RELEASE_*' --sort=-version:refname | head -n1)
          if [ -z "$LATEST_TAG" ]; then
            echo "No release tags found"
            echo "has_update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Latest release tag: ${LATEST_TAG}"

          if [ "$CURRENT_TAG" = "$LATEST_TAG" ]; then
            echo "Submodule is already at latest release"
            echo "has_update=false" >> "$GITHUB_OUTPUT"
          else
            echo "Update available: ${CURRENT_TAG} -> ${LATEST_TAG}"
            echo "has_update=true" >> "$GITHUB_OUTPUT"
            echo "new_tag=${LATEST_TAG}" >> "$GITHUB_OUTPUT"
            VERSION="${LATEST_TAG#RELEASE_}"
            VERSION="${VERSION//_/.}"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Update submodule to latest release
        if: steps.check.outputs.has_update == 'true'
        run: |
          cd smartmontools
          git checkout ${{ steps.check.outputs.new_tag }}
          cd ..
          git add smartmontools

      - name: Create Pull Request
        if: steps.check.outputs.has_update == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="update-smartmontools-${{ steps.check.outputs.version }}"
          VERSION="${{ steps.check.outputs.version }}"
          TAG="${{ steps.check.outputs.new_tag }}"

          git checkout -b "${BRANCH}"
          git commit -m "chore: update smartmontools submodule to ${TAG}"
          git push origin "${BRANCH}" --force

          EXISTING_PR=$(gh pr list --head "${BRANCH}" --json number -q '.[0].number')
          if [ -n "$EXISTING_PR" ]; then
            echo "PR #${EXISTING_PR} already exists for branch ${BRANCH}"
          else
            gh pr create \
              --title "Update smartmontools to v${VERSION}" \
              --body "Automated update of smartmontools submodule to release tag \`${TAG}\` (v${VERSION}).

              This PR was created automatically by the submodule update checker workflow.

              Once merged, the build workflow will produce library artifacts and create a release tagged \`v${VERSION}\`." \
                            --base main \
                            --head "${BRANCH}"
          fi

  check-drivedb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine upstream drivedb branch
        id: branch
        run: |
          VER=$(grep -o 'VERSION: [0-9.]*' drivedb/drivedb.h | head -1 | awk '{print $2}')
          echo "drivedb_branch=drivedb/${VER}" >> "$GITHUB_OUTPUT"
          echo "Tracking upstream branch: drivedb/${VER}"

      - name: Fetch upstream drivedb.h
        id: fetch
        run: |
          UPSTREAM_BRANCH="${{ steps.branch.outputs.drivedb_branch }}"
          git fetch --depth=1 https://github.com/smartmontools/smartmontools.git "${UPSTREAM_BRANCH}"
          git show FETCH_HEAD:drivedb.h > /tmp/upstream_drivedb.h
          if diff -q drivedb/drivedb.h /tmp/upstream_drivedb.h > /dev/null; then
            echo "has_update=false" >> "$GITHUB_OUTPUT"
            echo "drivedb.h is already up to date"
          else
            echo "has_update=true" >> "$GITHUB_OUTPUT"
            echo "drivedb.h has upstream updates"
          fi

      - name: Create or refresh drivedb PR
        if: steps.fetch.outputs.has_update == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UPSTREAM_BRANCH="${{ steps.branch.outputs.drivedb_branch }}"
          PR_BRANCH="update-drivedb"

          # Extract new/changed drive family names from the diff
          NEW_DRIVES=$(diff drivedb/drivedb.h /tmp/upstream_drivedb.h \
            | grep '^+  { "' \
            | grep -v '"VERSION:\|"DEFAULT' \
            | sed 's/^+  { "\([^"]*\)".*/- \1/' \
            | sort -u)

          # Update the file
          cp /tmp/upstream_drivedb.h drivedb/drivedb.h

          # Create/reset branch from current main and commit
          git checkout -B "${PR_BRANCH}" HEAD
          git add drivedb/drivedb.h
          git commit -m "chore: update drivedb.h from upstream ${UPSTREAM_BRANCH}"
          git push origin "${PR_BRANCH}" --force

          # Build PR body
          if [ -n "$NEW_DRIVES" ]; then
            DRIVES_SECTION="### New/updated drive entries

          ${NEW_DRIVES}"
                    else
                      DRIVES_SECTION="_No new drive families detected (attribute or firmware updates only)._"
                    fi
          
                    cat > /tmp/pr_body.md << EOF
          Automated update of \`drivedb/drivedb.h\` from upstream [\`${UPSTREAM_BRANCH}\`](https://github.com/smartmontools/smartmontools/tree/${UPSTREAM_BRANCH}).
          
          ${DRIVES_SECTION}
          
          ---
          _This PR was created automatically by the submodule update checker workflow._
          EOF
          
                    EXISTING_PR=$(gh pr list --head "${PR_BRANCH}" --state open --json number -q '.[0].number')
          if [ -n "$EXISTING_PR" ]; then
            echo "Refreshing existing PR #${EXISTING_PR}"
            gh pr edit "${EXISTING_PR}" --body-file /tmp/pr_body.md
          else
            gh pr create \
              --title "Update drivedb.h from upstream ${UPSTREAM_BRANCH}" \
              --body-file /tmp/pr_body.md \
              --base main \
              --head "${PR_BRANCH}"
          fi

