name: exp-pr-perm

on:
  workflow_dispatch:
    inputs:
      scenario:
        required: true
        type: choice
        options:
          - native-tiny
          - gitlink-only
          - upstream-subset
          - control-failing
          - same-ref
          - force-replica
          - force-fresh
          - wf-change
          - force-replica2-nosleep
          - force-replica2-sleep
          - foreign-parent-clean
          - foreign-merge
          - no-head
          - existing-real-head
          - real-head-push-create
          - pure-shape
      sha:
        description: "Upstream commit SHA (gitlink-only, upstream-subset)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Scenario native-tiny
        if: inputs.scenario == 'native-tiny'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          BRANCH="exp/native-tiny-${{ github.run_id }}"
          git fetch origin main
          git checkout -B "$BRANCH" origin/main
          echo "experiment native-tiny $(date -u +%s)" > docs/exp-native-tiny.md
          git add docs/exp-native-tiny.md
          git commit -m "test(exp): native tiny file"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "EXP native-tiny ${{ github.run_id }}" \
            --body "Native-tiny scenario: one small native file, no upstream content, no gitlink change."
          echo "SUCCESS: native-tiny PR created"

      - name: Scenario gitlink-only
        if: inputs.scenario == 'gitlink-only'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ inputs.sha }}
        run: |
          set -euxo pipefail
          BRANCH="exp/gitlink-only-${{ github.run_id }}"
          git fetch origin main
          git checkout -B "$BRANCH" origin/main
          git submodule update --init --depth 1 native/upstream
          (cd native/upstream && git fetch --depth=1 origin "$SHA" && git checkout --detach "$SHA")
          git add native/upstream
          git commit -m "test(exp): gitlink-only change to ${SHA}"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "EXP gitlink-only ${{ github.run_id }}" \
            --body "Gitlink-only scenario: only the native/upstream pointer changed (to ${SHA}). No other diff."
          echo "SUCCESS: gitlink-only PR created"

      - name: Scenario upstream-subset
        if: inputs.scenario == 'upstream-subset'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ inputs.sha }}
        run: |
          set -euxo pipefail
          BRANCH="exp/upstream-subset-${{ github.run_id }}"
          # SHA must be the upstream RELEASE_7_5 tag commit, whose tree has
          # smartmontools/drivedb.h with blob e6ec5022... (byte-identical to
          # the file in the failing re-vendor head).
          git fetch --depth=1 https://github.com/smartmontools/smartmontools.git "$SHA"
          git fetch origin main
          git checkout -B "$BRANCH" origin/main
          mkdir -p smartmontools
          git show "$SHA:smartmontools/drivedb.h" > smartmontools/drivedb.h
          wc -l smartmontools/drivedb.h
          git add smartmontools/drivedb.h
          git commit -m "test(exp): add upstream-identical drivedb.h at ${SHA}"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "EXP upstream-subset ${{ github.run_id }}" \
            --body "Upstream-subset scenario: adds ONE file (smartmontools/drivedb.h) byte-identical to upstream smartmontools/smartmontools. No gitlink change."
          echo "SUCCESS: upstream-subset PR created"

      - name: Scenario control-failing
        if: inputs.scenario == 'control-failing'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          BRANCH="exp/control-${{ github.run_id }}"
          git fetch origin main
          git fetch origin update-smartmontools-7.5
          git checkout -B "$BRANCH" origin/update-smartmontools-7.5
          git rev-parse HEAD
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "EXP control-failing ${{ github.run_id }}" \
            --body "Control scenario: same head commit as the failing force run (update-smartmontools-7.5), on a fresh branch name."
          echo "SUCCESS: control PR created"

      - name: Scenario same-ref
        if: inputs.scenario == 'same-ref'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          git fetch origin main
          git fetch origin update-smartmontools-7.5
          git checkout -B "update-smartmontools-7.5" origin/update-smartmontools-7.5
          git rev-parse HEAD
          cat > /tmp/pr_body.md <<'EOF'
          Automated merge of upstream release tag `RELEASE_7_5` into `native/`, carrying the real source diff (this is a genuine `git merge`, not a submodule bump — see docs/architecture/repository-layout.md).

          Once this PR merges to `main`, `tag-core-release.yml` will detect the merge, compute the next core version (`scripts/next-core-version.sh`), tag it, and dispatch `release-core.yml` — which builds every target, publishes the core release, and then dispatches `release-bindings-go.yml` to publish a paired bindings release at the same version. If this merge happens to change nothing in the native-core build artifact (see `scripts/core-artifact-changed.sh`), that gate will skip tagging and open a tracking issue instead of shipping a no-op release.
          EOF
          gh pr create \
            --title "Merge smartmontools RELEASE_7_5 (v7.5)" \
            --body-file /tmp/pr_body.md \
            --base main \
            --head "update-smartmontools-7.5"
          echo "SUCCESS: same-ref PR created"

      - name: Scenario force-replica
        if: inputs.scenario == 'force-replica'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          git fetch origin main
          git fetch origin refs/pull/28/head:refs/exp/oldhead
          git fetch origin refs/heads/update-smartmontools-7.5
          # Exact replica of failing run 31866746128: the branch was at the
          # old foreign head (646c05a15), then force-pushed to the native head
          # (bb36d911), then PR created immediately (<1s later).
          git checkout -B update-smartmontools-7.5 refs/exp/oldhead
          git push origin update-smartmontools-7.5 --force
          git checkout -B update-smartmontools-7.5 origin/update-smartmontools-7.5
          git push origin update-smartmontools-7.5 --force
          gh pr create --base main --head update-smartmontools-7.5 \
            --title "EXP force-replica ${{ github.run_id }}" \
            --body "Force-replica: old foreign head -> force-push native head -> create immediately."
          echo "SUCCESS: force-replica PR created"

      - name: Scenario force-fresh
        if: inputs.scenario == 'force-fresh'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          BRANCH="exp/force-fresh-${{ github.run_id }}"
          git fetch origin main
          git fetch origin refs/pull/28/head:refs/exp/oldhead
          git fetch origin refs/heads/update-smartmontools-7.5
          git checkout -B "$BRANCH" origin/main
          # Fresh branch name, same force-push sequence (foreign head then
          # native head) — isolates whether the branch's PR history matters.
          git reset --hard refs/exp/oldhead
          git push origin "$BRANCH" --force
          git reset --hard origin/update-smartmontools-7.5
          git push origin "$BRANCH" --force
          gh pr create --base main --head "$BRANCH" \
            --title "EXP force-fresh ${{ github.run_id }}" \
            --body "Force-fresh: fresh branch force-pushed through old foreign head then native head, then create."
          echo "SUCCESS: force-fresh PR created"

      - name: Scenario wf-change
        if: inputs.scenario == 'wf-change'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          BRANCH="exp/wf-change-${{ github.run_id }}"
          git fetch origin main
          git checkout -B "$BRANCH" origin/main
          echo "# experiment: workflow file modification" >> .github/workflows/exp-pr-perm.yml
          git add .github/workflows/exp-pr-perm.yml
          git commit -m "test(exp): modify workflow file"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "EXP wf-change ${{ github.run_id }}" \
            --body "wf-change: PR whose diff modifies a workflow file."
          echo "SUCCESS: wf-change PR created"

      - name: Scenario force-replica2-nosleep
        if: inputs.scenario == 'force-replica2-nosleep'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          # Prerequisite: the branch update-smartmontools-7.5 is at 646c05a15
          # (old foreign head) via a user-token setup push.
          git fetch origin main
          git fetch origin update-smartmontools-7.5
          git fetch origin exp/saved-native-head:refs/exp/native
          git checkout -B update-smartmontools-7.5 refs/exp/native
          git push origin update-smartmontools-7.5 --force
          gh pr create --base main --head update-smartmontools-7.5 \
            --title "EXP force-replica2-nosleep ${{ github.run_id }}" \
            --body "force-replica2-nosleep: exact failing sequence (646c05a15 -> force-push bb36d911 -> create immediately)."
          echo "SUCCESS: force-replica2-nosleep PR created"

      - name: Scenario force-replica2-sleep
        if: inputs.scenario == 'force-replica2-sleep'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          # Prerequisite: the branch update-smartmontools-7.5 is at 646c05a15
          # (old foreign head) via a user-token setup push.
          git fetch origin main
          git fetch origin update-smartmontools-7.5
          git fetch origin exp/saved-native-head:refs/exp/native
          git checkout -B update-smartmontools-7.5 refs/exp/native
          git push origin update-smartmontools-7.5 --force
          # Allow GitHub's ref pipeline to settle before createPullRequest.
          sleep 30
          gh pr create --base main --head update-smartmontools-7.5 \
            --title "EXP force-replica2-sleep ${{ github.run_id }}" \
            --body "force-replica2-sleep: same as nosleep but with 30s settle delay after force-push."
          echo "SUCCESS: force-replica2-sleep PR created"

      - name: Scenario foreign-parent-clean
        if: inputs.scenario == 'foreign-parent-clean'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          BRANCH="exp/foreign-parent-${{ github.run_id }}"
          git fetch origin main
          # Fetch the upstream tag commit as the foreign parent object.
          git fetch --depth=1 https://github.com/smartmontools/smartmontools.git f276b249fdc84019403491303479485030ac7c80
          git checkout -B "$BRANCH" origin/main
          echo "foreign-parent test $(date -u +%s)" > docs/exp-foreign-parent.md
          git add docs/exp-foreign-parent.md
          TREE="$(git write-tree)"
          # Native tree + a foreign parent (upstream tag commit). No workflow
          # file changes, no upstream-identical content.
          NEW="$(git commit-tree "$TREE" -p origin/main -p f276b249fdc84019403491303479485030ac7c80 -m 'test(exp): native tree with foreign parent')"
          git update-ref "refs/heads/$BRANCH" "$NEW"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "EXP foreign-parent-clean ${{ github.run_id }}" \
            --body "foreign-parent-clean: head commit has parent2 = upstream f276b249 (foreign), tree otherwise matches main + one tiny file."
          echo "SUCCESS: foreign-parent-clean PR created"

      - name: Scenario foreign-merge
        if: inputs.scenario == 'foreign-merge'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          BRANCH="exp/foreign-merge-${{ github.run_id }}"
          git fetch origin main
          # 646c05a15 = the historical 08-14 failing re-vendor merge head.
          git fetch origin refs/pull/28/head:refs/exp/oldhead
          # Fetch the upstream tag commit as the foreign parent object.
          git fetch --depth=1 https://github.com/smartmontools/smartmontools.git f276b249fdc84019403491303479485030ac7c80
          # Recreate the 08-14 failing head on CURRENT main: same foreign
          # 2-parent merge (parent2 = upstream f276b249) and same full
          # re-vendor tree (smartmontools/* + gitlink), but workflow files
          # match current main so the push is permitted.
          git checkout -B "$BRANCH" origin/main
          git checkout refs/exp/oldhead -- smartmontools native/upstream
          TREE="$(git write-tree)"
          NEW="$(git commit-tree "$TREE" -p origin/main -p f276b249fdc84019403491303479485030ac7c80 -m 'test(exp): recreate 08-14 foreign re-vendor merge head on current main')"
          git update-ref "refs/heads/$BRANCH" "$NEW"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "EXP foreign-merge ${{ github.run_id }}" \
            --body "foreign-merge: recreates the 08-14 failing head (2-parent merge, foreign parent f276b249, full re-vendor diff) on current main."
          echo "SUCCESS: foreign-merge PR created"

      - name: Scenario no-head
        if: inputs.scenario == 'no-head'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          BRANCH="exp/does-not-exist-${{ github.run_id }}"
          # Create a PR for a branch that does not exist, to capture the
          # exact error text GitHub returns for a missing/stale head ref.
          set +e
          OUT="$(gh pr create --base main --head "$BRANCH" --title "EXP no-head ${{ github.run_id }}" --body "no-head test" 2>&1)"
          RC=$?
          set -e
          echo "exit=$RC"
          echo "$OUT"
          # Re-run with --json to also capture structured output if available
          set +e
          OUT2="$(gh pr create --base main --head "$BRANCH" --title "EXP no-head ${{ github.run_id }}" --body "no-head test" --json number,url 2>&1)"
          RC2=$?
          set -e
          echo "exit2=$RC2"
          echo "$OUT2"

      - name: Scenario existing-real-head
        if: inputs.scenario == 'existing-real-head'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          # update-smartmontools-7.5 is already at 6f664f6d0 (pushed by the
          # failing real workflow run). No push here — just create the PR from
          # the existing head, with the same title/body as the real workflow.
          git fetch origin update-smartmontools-7.5
          echo "branch head: $(git rev-parse FETCH_HEAD)"
          gh pr create --base main --head update-smartmontools-7.5 \
            --title "Merge smartmontools RELEASE_7_5 (v7.5)" \
            --body "Automated merge of upstream release tag \`RELEASE_7_5\` into \`native/\`, carrying the real source diff (this is a genuine \`git merge\`, not a submodule bump — see docs/architecture/repository-layout.md).

          Once this PR merges to \`main\`, \`tag-core-release.yml\` will detect the merge, compute the next core version (\`scripts/next-core-version.sh\`), tag it, and dispatch \`release-core.yml\` — which builds every target, publishes the core release, and then dispatches \`release-bindings-go.yml\` to publish a paired bindings release at the same version. If this merge happens to change nothing in the native-core build artifact (see \`scripts/core-artifact-changed.sh\`), that gate will skip tagging and open a tracking issue instead of shipping a no-op release."
          echo "SUCCESS: existing-real-head PR created"

      - name: Scenario real-head-push-create
        if: inputs.scenario == 'real-head-push-create'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          # Same TREE (8051f791), same branch, same title/body as the failing
          # real workflow run — but the head is re-created as a NEW commit so
          # the force-push is real, then a PR is created immediately,
          # replicating the push+create timing of the real workflow.
          git fetch origin main
          git fetch origin update-smartmontools-7.5:refs/exp/realhead
          TREE="$(git rev-parse refs/exp/realhead^{tree})"
          NEW="$(git commit-tree "$TREE" -p origin/main -m 'Re-vendor smartmontools RELEASE_7_5')"
          git checkout -B update-smartmontools-7.5 "$NEW"
          git push origin update-smartmontools-7.5 --force
          gh pr create --base main --head update-smartmontools-7.5 \
            --title "Merge smartmontools RELEASE_7_5 (v7.5)" \
            --body "push+create from exp workflow with the real failing head."
          echo "SUCCESS: real-head-push-create PR created"

      - name: Scenario pure-shape
        if: inputs.scenario == 'pure-shape'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          # Reproduce the EXACT failing real-run shape from THIS (exp) workflow:
          # head = base + 1 single-parent commit, diff = ONLY smartmontools/*
          # (same tree the real workflow produced), pushed then PR created
          # immediately. Eliminates the workflow-file variable.
          git fetch origin main
          git fetch origin update-smartmontools-7.5:refs/exp/realhead
          SMTREE="$(git rev-parse refs/exp/realhead:smartmontools)"
          git checkout -B tmp-head origin/main
          git rm -r --cached smartmontools >/dev/null 2>&1 || true
          git read-tree --prefix=smartmontools/ "${SMTREE}"
          NEW_TREE="$(git write-tree)"
          NEW_COMMIT="$(git commit-tree "${NEW_TREE}" -p origin/main -m 'Re-vendor smartmontools RELEASE_7_5')"
          git update-ref refs/heads/update-smartmontools-7.5 "${NEW_COMMIT}"
          echo "head: ${NEW_COMMIT}  tree: ${NEW_TREE}"
          git diff --stat origin/main "${NEW_COMMIT}" -- . ':(exclude)smartmontools' | tail -2
          git push origin update-smartmontools-7.5 --force
          gh pr create \
            --title "Merge smartmontools RELEASE_7_5 (v7.5)" \
            --body "pure-shape: head = base+1, single parent, diff = ONLY smartmontools/*" \
            --base main \
            --head update-smartmontools-7.5
          echo "SUCCESS: pure-shape PR created"
