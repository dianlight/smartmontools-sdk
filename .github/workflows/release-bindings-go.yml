name: Release (bindings/go)

on:
  push:
    tags:
      - 'bindings/go/v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine version and module path
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG=$(git tag -l 'bindings/go/v*' --sort=-version:refname | head -n1)
          fi
          VERSION="${TAG#bindings/go/}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Releasing bindings/go ${VERSION}"

      - name: Warm the Go module proxy
        env:
          GOPROXY: proxy.golang.org
        run: |
          go list -m "github.com/dianlight/smartmontools-sdk/bindings/go@${{ steps.version.outputs.tag }}"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          gh release delete "${TAG}" --repo "${{ github.repository }}" --yes --cleanup-tag 2>/dev/null || true
          gh release create "${TAG}" \
            --repo "${{ github.repository }}" \
            --title "bindings/go ${VERSION}" \
            --notes "Go bindings release ${VERSION}. Install with: go get github.com/dianlight/smartmontools-sdk/bindings/go@${TAG}" \
            --latest=false
