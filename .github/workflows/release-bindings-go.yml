name: Release (bindings/go)

on:
  push:
    tags:
      - 'bindings/go/v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Bindings version to release (e.g. 8.0.0), without the bindings/go/v prefix. Takes precedence over core_version and bump.'
        required: false
        type: string
      core_version:
        description: 'Core version to mirror (e.g. 8.0.0) — used when this is dispatched as part of a core release cascade. Ignored if version is set.'
        required: false
        type: string
      bump:
        description: 'Standalone version bump for a Go-only release, independent of any core release. Ignored if version or core_version is set.'
        required: false
        type: choice
        options:
          - patch
          - minor
      dry_run:
        description: 'Print what would happen without creating a tag, publishing a release, or warming the proxy.'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            V="${{ github.event.inputs.version }}"
            TAG="bindings/go/v${V#v}"
          elif [ -n "${{ github.event.inputs.core_version }}" ]; then
            TAG="$(scripts/next-bindings-go-version.sh --core-version "${{ github.event.inputs.core_version }}")"
          elif [ -n "${{ github.event.inputs.bump }}" ]; then
            TAG="$(scripts/next-bindings-go-version.sh --bump "${{ github.event.inputs.bump }}")"
          else
            TAG="$(scripts/next-bindings-go-version.sh --current)"
            if [ -z "${TAG}" ]; then
              echo "::error::no existing bindings/go release, and none of 'version', 'core_version', or 'bump' were given." >&2
              exit 1
            fi
          fi

          VERSION="${TAG#bindings/go/}"

          DRY_RUN="false"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DRY_RUN="${{ github.event.inputs.dry_run }}"
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "dry_run=${DRY_RUN}" >> "$GITHUB_OUTPUT"
          echo "Releasing bindings/go ${VERSION} (tag ${TAG}, dry_run=${DRY_RUN})"

      - name: Ensure tag exists
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists."
          elif [ "${{ steps.version.outputs.dry_run }}" = "true" ]; then
            echo "[dry-run] would create and push tag ${TAG}"
          else
            git tag "${TAG}"
            git push origin "${TAG}"
          fi

      - name: Warm the Go module proxy
        if: steps.version.outputs.dry_run != 'true'
        working-directory: bindings/go
        env:
          GOPROXY: proxy.golang.org
        run: |
          # go list -m's version query takes the *module version*
          # (e.g. v8.0.2-pre.504), not the full repo tag
          # (bindings/go/v8.0.2-pre.504) — the subdirectory prefix that
          # makes the git tag unique across the monorepo must not appear
          # after the @. Using the full tag here was a latent bug: it
          # happened to warm nothing (go list failed and the step only
          # ::warning::s, never fatally), silently skipping the proxy
          # warm-up on every past release.
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          if ! go list -m "github.com/dianlight/smartmontools-sdk/bindings/go/v8@${VERSION}"; then
            echo "::warning::failed to warm the Go module proxy for ${TAG} (version ${VERSION}) — non-fatal, the module will still be fetchable on first consumer request."
          fi

      - name: Dry-run summary
        if: steps.version.outputs.dry_run == 'true'
        run: |
          echo "[dry-run] would create/update release ${{ steps.version.outputs.tag }} and skip proxy warm-up."

      - name: Create or update release
        if: steps.version.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          TAG_SHA=$(git rev-list -n1 "${TAG}")

          # --prerelease and --latest are mutually exclusive on the GitHub
          # REST API — choose based on the version string, mirroring
          # release-core.yml. --latest=false is kept in the stable branch
          # too: bindings/go is never GitHub's repo-wide "latest release"
          # (the native core release owns that), it only stops being an
          # explicit *pre*release once the version has no "-".
          LATEST_OR_PRERELEASE_FLAG="--latest=false"
          PRERELEASE_NOTE=""
          if [[ "${VERSION}" == *-* ]]; then
            LATEST_OR_PRERELEASE_FLAG="--prerelease"
            # Plain `go get` (no explicit @version) never reaches a
            # prerelease on its own — it resolves through @latest, which
            # (once the v8.0.1 tombstone is published) falls through past
            # v8.0.0/v8.0.1 to the newest prerelease. Until then, or for a
            # consumer who wants this *specific* build, the @version pin
            # below is mandatory, not a convenience. Built with printf
            # rather than an embedded literal newline in the assignment
            # above: a YAML block scalar (this `run: |`) ends as soon as it
            # sees a less-indented line, and a raw newline inside a shell
            # string here would have produced exactly that.
            PRERELEASE_NOTE="$(printf '\n\n**This is a pre-release.** Install it with the explicit version pin above — plain `go get github.com/dianlight/smartmontools-sdk/bindings/go/v8` (no `@version`) will not select this build until it becomes `@latest`. See docs/development/release-process.md for the pre-release scheme.')"
          fi

          {
            echo "Go bindings release ${VERSION}."
            echo
            echo "Install with: \`go get github.com/dianlight/smartmontools-sdk/bindings/go/v8@${VERSION}\`"
            echo "${PRERELEASE_NOTE}"
            if [ -n "${{ github.event.inputs.core_version }}" ]; then
              echo
              echo "Paired with native core [\`v${{ github.event.inputs.core_version }}\`](https://github.com/${{ github.repository }}/releases/tag/v${{ github.event.inputs.core_version }})."
            fi
          } > release-notes.md

          gh release delete "${TAG}" --repo "${{ github.repository }}" --yes 2>/dev/null || true
          gh release create "${TAG}" \
            --target "${TAG_SHA}" \
            --repo "${{ github.repository }}" \
            --title "bindings/go ${VERSION}" \
            --notes-file release-notes.md \
            "${LATEST_OR_PRERELEASE_FLAG}"
