name: Build and Release

on:
  pull_request:
    branches: [main]
    paths:
      - '.gitmodules'  
      - 'drivedb/drivedb.h'
      - '.github/workflows/build.yml'
      - 'Makefile.am'
      - 'configure.ac'
      - 'lib/**'
      - 'include/**'
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - name: Determine version from submodule
        id: version
        run: |
          cd smartmontools
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$TAG" ]; then
            TAG=$(git rev-parse --short HEAD)
          fi
          VERSION="${TAG#RELEASE_}"
          VERSION="${VERSION//_/.}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Detected version: ${VERSION}"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-amd64
            host: x86_64-linux-gnu
            cc: gcc
            cxx: g++
            cflags: ""
            cxxflags: ""
            deps: ""
            container: ""
            zig_version: ""

          - os: ubuntu-latest
            target: linux-aarch64
            host: aarch64-linux-gnu
            cc: aarch64-linux-gnu-gcc
            cxx: aarch64-linux-gnu-g++
            cflags: ""
            cxxflags: ""
            deps: gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
            container: ""
            zig_version: ""

          - os: ubuntu-latest
            target: linux-amd64-musl
            host: x86_64-linux-musl
            cc: zig cc -target x86_64-linux-musl
            cxx: zig c++ -target x86_64-linux-musl
            cflags: ""
            cxxflags: ""
            deps: ""
            container: ""
            zig_version: 0.13.0

          - os: ubuntu-latest
            target: linux-aarch64-musl
            host: aarch64-linux-musl
            cc: zig cc -target aarch64-linux-musl
            cxx: zig c++ -target aarch64-linux-musl
            cflags: ""
            cxxflags: ""
            deps: ""
            container: ""
            zig_version: 0.13.0

          - os: ubuntu-latest
            target: darwin-amd64
            host: x86_64-apple-darwin20.4
            cc: o64-clang
            cxx: o64-clang++
            cflags: "-arch x86_64"
            cxxflags: "-arch x86_64 -stdlib=libc++"
            deps: ""
            container: ghcr.io/smartmontools/docker-build:master
            zig_version: ""

          - os: ubuntu-latest
            target: darwin-aarch64
            host: x86_64-apple-darwin20.4
            cc: o64-clang
            cxx: o64-clang++
            cflags: "-arch arm64"
            cxxflags: "-arch arm64 -stdlib=libc++"
            deps: ""
            container: ghcr.io/smartmontools/docker-build:master
            zig_version: ""

          - os: ubuntu-latest
            target: windows-amd64
            host: x86_64-w64-mingw32
            cc: x86_64-w64-mingw32-gcc
            cxx: x86_64-w64-mingw32-g++
            cflags: ""
            cxxflags: ""
            deps: gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
            container: ""
            zig_version: ""

    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container || null }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      SMARTMONTOOLS_TEST_BUILD: "1"

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - name: Install dependencies
        if: matrix.deps != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.deps }}

      - name: Setup Zig toolchain
        if: matrix.zig_version != ''
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig_version }}

      - name: Setup Darwin cross-compiler PATH
        if: contains(matrix.target, 'darwin')
        run: |
          echo "/usr/osxcross/bin" >> $GITHUB_PATH
          echo "LD_LIBRARY_PATH=/usr/osxcross/lib" >> $GITHUB_ENV

      - name: Sync local drivedb.h to smartmontools submodule
        run: |
          if [ -f drivedb/drivedb.h ]; then
            echo "Syncing drivedb/drivedb.h to smartmontools/drivedb.h"
            cp drivedb/drivedb.h smartmontools/drivedb.h
          else
            echo "Warning: drivedb/drivedb.h not found"
          fi          

      - name: Build library
        run: |
          ./autogen.sh --force
          mkdir -p build && cd build

          CONFIGURE_ARGS="--with-devel=yes --with-build-info='(GHA Build)'"

          if [ "${{ matrix.host }}" != "x86_64-linux-gnu" ]; then
            CONFIGURE_ARGS="${CONFIGURE_ARGS} --build=$(../config.guess) --host=${{ matrix.host }}"
          fi

          CC="${{ matrix.cc }}"
          CXX="${{ matrix.cxx }}"
          CFLAGS="${{ matrix.cflags }}"
          CXXFLAGS="${{ matrix.cxxflags }}"

          eval ../configure ${CONFIGURE_ARGS} \
            ${CC:+CC=\"$CC\"} \
            ${CXX:+CXX=\"$CXX\"} \
            ${CFLAGS:+CFLAGS=\"$CFLAGS\"} \
            ${CXXFLAGS:+CXXFLAGS=\"$CXXFLAGS\"}

          make -C include
          make -j$(nproc) -C lib libsmartmon.la

      - name: Build libsmartmon_go wrapper (purego lib backend)
        if: matrix.target != 'windows-amd64'
        env:
          SMARTMONTOOLS_GO_REF: v0.4.1
        run: |
          set -euo pipefail

          # Fetch the C wrapper sources pinned to the smartmontools-go release
          # that SRAT vendors. The smartmontools-go-version file lets consumers
          # assert their vendored ref matches the wrapper ABI.
          mkdir -p csrc
          for f in smartmon_c_api.cpp smartmon_c_api.h; do
            curl -fsSL "https://raw.githubusercontent.com/dianlight/smartmontools-go/${SMARTMONTOOLS_GO_REF}/backends/lib/csrc/${f}" \
              -o "csrc/${f}"
          done

          CXX="${{ matrix.cxx }}"
          CXXFLAGS="${{ matrix.cxxflags }}"
          COMMON="-std=c++17 -fPIC -O2 -I${GITHUB_WORKSPACE}/include -I${GITHUB_WORKSPACE}/build/include"

          mkdir -p artifacts/lib

          if [[ "${{ matrix.target }}" == darwin-* ]]; then
            OUT="artifacts/lib/libsmartmon_go.dylib"
            eval "${CXX} ${COMMON} ${CXXFLAGS} -dynamiclib -o ${OUT} csrc/smartmon_c_api.cpp -L${GITHUB_WORKSPACE}/build/lib/.libs -lsmartmon -lm -framework CoreFoundation -framework IOKit"
          elif [[ "${{ matrix.cxx }}" == zig* ]]; then
            # zig c++ links its bundled libc++ automatically; no -lstdc++.
            OUT="artifacts/lib/libsmartmon_go.so"
            eval "${CXX} ${COMMON} ${CXXFLAGS} -shared -o ${OUT} csrc/smartmon_c_api.cpp -L${GITHUB_WORKSPACE}/build/lib/.libs -lsmartmon -lm"
          else
            OUT="artifacts/lib/libsmartmon_go.so"
            eval "${CXX} ${COMMON} ${CXXFLAGS} -shared -o ${OUT} csrc/smartmon_c_api.cpp -L${GITHUB_WORKSPACE}/build/lib/.libs -lsmartmon -lstdc++ -lm"
          fi

          echo "${SMARTMONTOOLS_GO_REF}" > artifacts/lib/smartmontools-go-version
          ls -la artifacts/lib/

      - name: Package artifacts
        run: |
          mkdir -p artifacts/lib artifacts/include
          cp build/lib/.libs/libsmartmon.a artifacts/lib/
          cp -r include/smartmon artifacts/include/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: libsmartmon-${{ matrix.target }}
          path: artifacts/
          retention-days: 5

  release:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    needs: [prepare, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Package release archives
        run: |
          mkdir -p release
          for dir in artifacts/libsmartmon-*; do
            target=$(basename "$dir" | sed 's/libsmartmon-//')
            tar -czf "release/libsmartmon-${VERSION}-${target}.tar.gz" -C "$dir" .
          done

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "v${VERSION}" --repo "${{ github.repository }}" --yes --cleanup-tag 2>/dev/null || true
          gh release create "v${VERSION}" \
            release/* \
            --repo "${{ github.repository }}" \
            --title "smartmontools-sdk v${VERSION}" \
            --notes "Library build from smartmontools ${VERSION}" \
            --latest
