name: Build and Release

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Determine version from submodule
        id: version
        run: |
          cd smartmontools
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$TAG" ]; then
            TAG=$(git rev-parse --short HEAD)
          fi
          VERSION="${TAG#RELEASE_}"
          VERSION="${VERSION//_/.}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Detected version: ${VERSION}"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-amd64
            host: x86_64-linux-gnu
            cc: gcc
            cxx: g++
            cflags: ""
            cxxflags: ""
            deps: ""
            container: ""

          - os: ubuntu-latest
            target: linux-aarch64
            host: aarch64-linux-gnu
            cc: aarch64-linux-gnu-gcc
            cxx: aarch64-linux-gnu-g++
            cflags: ""
            cxxflags: ""
            deps: gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
            container: ""

          - os: ubuntu-latest
            target: darwin-amd64
            host: x86_64-apple-darwin20.4
            cc: o64-clang
            cxx: o64-clang++
            cflags: "-arch x86_64"
            cxxflags: "-arch x86_64 -stdlib=libc++"
            deps: ""
            container: ghcr.io/smartmontools/docker-build:master

          - os: ubuntu-latest
            target: darwin-aarch64
            host: x86_64-apple-darwin20.4
            cc: o64-clang
            cxx: o64-clang++
            cflags: "-arch arm64"
            cxxflags: "-arch arm64 -stdlib=libc++"
            deps: ""
            container: ghcr.io/smartmontools/docker-build:master

          - os: ubuntu-latest
            target: windows-amd64
            host: x86_64-w64-mingw32
            cc: x86_64-w64-mingw32-gcc
            cxx: x86_64-w64-mingw32-g++
            cflags: ""
            cxxflags: ""
            deps: gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
            container: ""

          - os: ubuntu-latest
            target: windows-aarch64
            host: aarch64-w64-mingw32
            cc: ""
            cxx: ""
            cflags: ""
            cxxflags: ""
            deps: ""
            container: ghcr.io/smartmontools/docker-build:master

    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container || null }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Install dependencies
        if: matrix.deps != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.deps }}

      - name: Setup Darwin cross-compiler PATH
        if: contains(matrix.target, 'darwin')
        run: |
          echo "/usr/osxcross/bin" >> $GITHUB_PATH
          echo "LD_LIBRARY_PATH=/usr/osxcross/lib" >> $GITHUB_ENV

      - name: Build library
        run: |
          ./autogen.sh --force
          mkdir -p build && cd build

          CONFIGURE_ARGS="--with-devel=yes --with-build-info='(GHA Build)'"

          if [ "${{ matrix.host }}" != "x86_64-linux-gnu" ]; then
            CONFIGURE_ARGS="${CONFIGURE_ARGS} --build=$(../config.guess) --host=${{ matrix.host }}"
          fi

          CC="${{ matrix.cc }}"
          CXX="${{ matrix.cxx }}"
          CFLAGS="${{ matrix.cflags }}"
          CXXFLAGS="${{ matrix.cxxflags }}"

          eval ../configure ${CONFIGURE_ARGS} \
            ${CC:+CC=\"$CC\"} \
            ${CXX:+CXX=\"$CXX\"} \
            ${CFLAGS:+CFLAGS=\"$CFLAGS\"} \
            ${CXXFLAGS:+CXXFLAGS=\"$CXXFLAGS\"}

          make -C include
          make -j$(nproc) -C lib

      - name: Package artifacts
        run: |
          mkdir -p artifacts/lib artifacts/include
          cp build/lib/.libs/libsmartmon.a artifacts/lib/
          cp -r include/smartmon artifacts/include/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libsmartmon-${{ matrix.target }}
          path: artifacts/
          retention-days: 5

  release:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    needs: [prepare, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package release archives
        run: |
          mkdir -p release
          for dir in artifacts/libsmartmon-*; do
            target=$(basename "$dir" | sed 's/libsmartmon-//')
            tar -czf "release/libsmartmon-${VERSION}-${target}.tar.gz" -C "$dir" .
          done

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "v${VERSION}" --repo "${{ github.repository }}" --yes --cleanup-tag 2>/dev/null || true
          gh release create "v${VERSION}" \
            release/* \
            --repo "${{ github.repository }}" \
            --title "smartmontools-sdk v${VERSION}" \
            --notes "Library build from smartmontools ${VERSION}" \
            --latest
