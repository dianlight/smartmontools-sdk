name: Create cppcheck report
on: workflow_dispatch
jobs:
  create-cppcheck-report:
    runs-on: ubuntu-latest
    steps:
      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 800
          fetch-tags: true
      - name: Run cppcheck
        run: |
          VERSION=$(native/src/getversion.sh -n) &&
          DEST="smartmontools-cppcheck-$VERSION.txt" &&
          echo "Creating $DEST..." &&
          native/src/cppcheck.sh -j6 -q | tee "$DEST"
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: smartmontools-cppcheck
          path: smartmontools-cppcheck-*.txt
          retention-days: 30
