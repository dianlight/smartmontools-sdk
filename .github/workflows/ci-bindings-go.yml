name: CI (bindings/go)

on:
  pull_request:
    branches: [main]
    paths:
      - 'bindings/go/**'
      - 'native/capi/**'
      - 'native/drivedb/**'
      - 'scripts/build-wrapper.sh'
      - 'scripts/sync-drivedb-go.sh'
      - '.github/workflows/ci-bindings-go.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v2
        with:
          working_directory: bindings/go

      - name: mise run ci
        working-directory: bindings/go
        run: mise run ci

      - name: Coverage
        working-directory: bindings/go
        run: mise run coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: bindings/go/coverage.txt
          flags: bindings-go
          token: ${{ secrets.CODECOV_TOKEN }}

  drivedb-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Assert no drift between native/drivedb and bindings/go copy
        run: |
          scripts/sync-drivedb-go.sh
          git diff --exit-code -- bindings/go/backends/exec/drivedb.h bindings/go/backends/exec/drivedb_version.go

  integration:
    runs-on: ubuntu-latest
    env:
      SMARTMONTOOLS_TEST_BUILD: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: jdx/mise-action@v2
        with:
          working_directory: bindings/go

      - name: Build native core (linux-amd64)
        working-directory: native
        run: |
          ./autogen.sh --force
          mkdir -p build && cd build
          ../configure --with-devel=yes --with-pic
          make -C include
          make -j"$(nproc)" -C lib libsmartmon.la

      - name: Build C ABI wrapper
        run: scripts/build-wrapper.sh --target linux-amd64

      - name: Run lib-backend integration tests
        working-directory: bindings/go
        env:
          SMARTMON_INTEGRATION: "1"
          SMARTMON_LIB_PATH: ${{ github.workspace }}/packaging/artifacts/lib/libsmartmon_go.so
        run: go test -failfast ./backends/lib/...
